services:
  ollama:
    profiles: [ollama]
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:${OLLAMA_DOCKER_TAG-latest}

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USE_SLIM: "true"
    image: ghcr.io/zhizinan1997/ryanai:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      - 'OLLAMA_BASE_URL=${OLLAMA_BASE_URL-}'
      - 'OPENAI_API_BASE_URL=${OPENAI_API_BASE_URL-}'
      - 'OPENAI_API_KEY=${OPENAI_API_KEY-}'
      - 'RYANAI_DISABLE_LOCAL_EMBEDDING_MODELS=true'
      - 'RAG_EMBEDDING_ENGINE=${RAG_EMBEDDING_ENGINE-openai}'
      - 'RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL-text-embedding-3-small}'
      - 'RAG_EMBEDDING_MODEL_AUTO_UPDATE=false'
      - 'RAG_OPENAI_API_BASE_URL=${RAG_OPENAI_API_BASE_URL-}'
      - 'RAG_OPENAI_API_KEY=${RAG_OPENAI_API_KEY-}'
      # The sidecar transport is always available; the product feature and
      # channel policy are controlled from the RyanAI admin panel/database.
      - 'BOT_GATEWAY_ENABLED=true'
      - 'BOT_GATEWAY_INTERNAL_URL=http://ryanai-bot-gateway:${BOT_GATEWAY_INTERNAL_PORT:-8787}'
      - 'BOT_GATEWAY_HMAC_SECRET=${BOT_GATEWAY_HMAC_SECRET-}'
      - 'BOT_GATEWAY_CREDENTIAL_MASTER_KEY=${BOT_GATEWAY_CREDENTIAL_MASTER_KEY-}'
      - 'BOT_GATEWAY_COORDINATION_MODE=${BOT_GATEWAY_COORDINATION_MODE-single}'
      - 'BOT_GATEWAY_SCHEDULER_MODE=${BOT_GATEWAY_SCHEDULER_MODE-shadow}'
      - 'REDIS_URL=${REDIS_URL-}'
      - 'WEBUI_SECRET_KEY='
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  ryanai-bot-gateway:
    image: ${BOT_GATEWAY_IMAGE-ghcr.io/zhizinan1997/ryanai-bot-gateway}:${BOT_GATEWAY_DOCKER_TAG-latest}
    container_name: ryanai-bot-gateway
    depends_on:
      open-webui:
        condition: service_healthy
    expose:
      - '${BOT_GATEWAY_INTERNAL_PORT:-8787}'
    environment:
      - 'NODE_ENV=production'
      - 'BOT_GATEWAY_ENABLED=${BOT_GATEWAY_ENABLED:-true}'
      - 'BOT_GATEWAY_INTERNAL_PORT=${BOT_GATEWAY_INTERNAL_PORT:-8787}'
      - 'BOT_GATEWAY_HMAC_SECRET=${BOT_GATEWAY_HMAC_SECRET-}'
      - 'BOT_GATEWAY_CREDENTIALS_ENCRYPTION_KEY=${BOT_GATEWAY_CREDENTIALS_ENCRYPTION_KEY-}'
      - 'BOT_GATEWAY_DATA_DIR=/data'
      - 'BOT_GATEWAY_OPENCLAW_STATE_DIR=${BOT_GATEWAY_OPENCLAW_STATE_DIR-/data/openclaw/state}'
      - 'BOT_GATEWAY_OPENCLAW_HOME_DIR=${BOT_GATEWAY_OPENCLAW_HOME_DIR-/data/openclaw/home}'
      - 'BOT_GATEWAY_OPENCLAW_STARTUP_TIMEOUT_MS=${BOT_GATEWAY_OPENCLAW_STARTUP_TIMEOUT_MS-180000}'
      - 'BOT_GATEWAY_OPENCLAW_TOPOLOGY=${BOT_GATEWAY_OPENCLAW_TOPOLOGY-shared}'
      - 'BOT_GATEWAY_OPENCLAW_SHARD_CAPACITY=${BOT_GATEWAY_OPENCLAW_SHARD_CAPACITY-12}'
      - 'BOT_GATEWAY_COORDINATION_MODE=${BOT_GATEWAY_COORDINATION_MODE-single}'
      - 'REDIS_URL=${REDIS_URL-}'
      - 'BOT_GATEWAY_NODE_ID=${BOT_GATEWAY_NODE_ID-}'
      - 'BOT_GATEWAY_ADVERTISE_URL=${BOT_GATEWAY_ADVERTISE_URL-}'
      - 'BOT_GATEWAY_LEASE_TTL_MS=${BOT_GATEWAY_LEASE_TTL_MS-45000}'
      - 'BOT_GATEWAY_LEASE_RENEW_MS=${BOT_GATEWAY_LEASE_RENEW_MS-15000}'
      - 'RYANAI_BASE_URL=http://open-webui:8080'
    volumes:
      - ryanai-bot-gateway:/data
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui:
    name: open-webui
  ryanai-bot-gateway:
    name: ryanai-bot-gateway
